name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders only. Nothing in CI connects to a database: the unit tests
      # mock the repositories, and the smoke test (which needs MongoDB) is not run here.
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/kf_ci_unused
      JWT_ADMIN_SECRET: ci-placeholder-secret-not-used-anywhere
      CORS_ORIGINS: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `postinstall` runs the production build, so this step also proves it compiles.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
